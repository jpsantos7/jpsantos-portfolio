name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Fast gates on every push.
  fast:
    name: fast gates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:fast

  # Everything, including Playwright (three engines), axe and Lighthouse CI,
  # on pull requests. The job name `check` is the status check that the
  # `production` branch protection requires.
  check:
    name: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
