<!doctype html>
<!--
  PROTOTYPE, round 2 — throwaway. Ticket 008 "Visual direction: type, space, colour, layout".
  Round 1 (A Editorial, B Stark, C Hybrid) is in commit e737601; the owner picked C (Hybrid).
  Round 2 keeps C's structure and type, and asks one question: how should yellow be used,
  given yellow on the light background is ~1.35:1 (fails text and UI contrast)?
    C1 Surface  — yellow only as a background, always with dark ink on it.
    C2 Marker   — yellow only as small marks (full stop, highlight, rules); ink carries everything.
    C3 Duotone  — yellow lives in the images (yellow/ink duotone); a dark-mustard ink for text accents in light.
  Light and dark for every variant: theme button or T. "contrast" in the bar shows live ratios.
  Images: Unsplash (hotlinked), stand-ins for style only. Copy is placeholder.
  Run: open this file in a browser. Nothing here is production code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE 008 · Visual direction · round 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,700;0,900;1,900&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p,dl,dd,figure,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
img{display:block;max-inline-size:100%;block-size:auto}
a{color:inherit}
.v[hidden]{display:none!important}
.visually-hidden{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.proto-divider{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:10px;background:repeating-linear-gradient(45deg,#ff00aa22 0 10px,transparent 10px 20px);color:#a0006a;border-block:1px dashed #a0006a;margin:0}

/* =================== shared Hybrid structure (chosen in round 1) =================== */
.v{
  /* light */
  --bg:#f7f4ed; --fg:#161412; --mid:#5a544f; --line:#dcd6ca; --card:#ece7dd;
  --yellow:#f6d200; --on-yellow:#161412; --accent-text:var(--fg);
  --display:"Hanken Grotesk",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; --italic:"Instrument Serif",Georgia,serif;
  --step-0:clamp(1rem,.95rem + .3vw,1.2rem);
  --step-2:clamp(1.6rem,1.2rem + 1.8vw,2.8rem);
  --step-6:clamp(3.6rem,1rem + 13vw,17rem);
  --gutter:clamp(1rem,4vw,3.5rem); --space-l:clamp(3.5rem,2rem + 7vw,10rem);
  --radius:1.25rem;
  background:var(--bg); color:var(--fg); font:400 var(--step-0)/1.6 var(--body);
}
/* dark: warm charcoal, not near-black (round-1 feedback: too dark) */
.dark .v{--bg:#1f1d1a; --fg:#f1ede5; --mid:#a9a198; --line:#3a3631; --card:#2a2723; --accent-text:var(--yellow)}
.v :focus-visible{outline:3px solid var(--fg);outline-offset:3px;box-shadow:0 0 0 6px var(--yellow)}
.v .wrap{padding-inline:var(--gutter)}
.v .mono{font:500 .75rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.v header .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:1.25rem;flex-wrap:wrap;gap:1rem}
.v .logo{font:900 1.25rem/1 var(--display);letter-spacing:-.03em;text-decoration:none}
.v nav ul{display:flex;gap:clamp(1rem,3vw,2.5rem)}
.v nav a{text-decoration:none}
.v nav a:hover{text-decoration:underline;text-underline-offset:.3em}
.v .hero{padding-block:calc(var(--space-l)/2) var(--space-l)}
.v .hero h1{font:900 var(--step-6)/.86 var(--display);letter-spacing:-.055em;margin-inline-start:-.04em}
.v .hero-foot{display:grid;gap:1.5rem;margin-block-start:clamp(2rem,5vw,4rem)}
@media (min-width:52em){.v .hero-foot{grid-template-columns:1fr 1fr 1fr}.v .hero-foot p{grid-column:2/4}}
.v .hero-foot p{font:400 var(--step-2)/1.2 var(--display);letter-spacing:-.02em;max-inline-size:26ch}
.v .hero-foot em,.v .statement em{font:italic 400 1.1em/1 var(--italic)}
.v .head-row{display:flex;justify-content:space-between;align-items:baseline;padding-block:1rem;border-block-start:1px solid var(--fg)}
.v .cards{display:grid;gap:clamp(1rem,2vw,2rem);padding-block:1.5rem var(--space-l)}
@media (min-width:52em){.v .cards{grid-template-columns:repeat(3,1fr)}}
.v .card a{text-decoration:none;display:block}
.v .cover{aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;background:var(--card)}
.v .cover img{inline-size:100%;block-size:100%;object-fit:cover}
@media (prefers-reduced-motion:no-preference){.v .cover img{transition:transform .4s cubic-bezier(.2,.7,.2,1)}.v .card a:hover .cover img{transform:scale(1.03)}}
.v .card h3{margin-block-start:1rem;font:700 var(--step-0)/1.3 var(--display)}
.v .card a:hover h3{text-decoration:underline;text-underline-offset:.25em}
.v .card p{color:var(--mid);font-size:.95rem}
.v .card .mono{display:block;margin-block-start:.5rem;color:var(--mid)}
.v .statement{padding-block:var(--space-l);border-block-start:1px solid var(--fg);display:grid;gap:2rem;align-items:end}
@media (min-width:52em){.v .statement{grid-template-columns:2fr 1fr}}
.v .statement p{font:700 var(--step-2)/1.15 var(--display);letter-spacing:-.025em;max-inline-size:30ch}
.v .portrait{aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;max-inline-size:22rem}
.v .portrait img{inline-size:100%;block-size:100%;object-fit:cover}
.v footer .wrap{padding-block:var(--space-l) 1.5rem}
.v footer .big{font:900 var(--step-6)/.86 var(--display);letter-spacing:-.055em}
.v footer .big a{text-decoration:none}
.v footer .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-block-start:var(--space-l)}
/* case study */
.v .cs-open .wrap{padding-block:var(--space-l)}
.v .cs-open h1{font:900 clamp(2.5rem,1rem + 6vw,7rem)/.9 var(--display);letter-spacing:-.045em;max-inline-size:16ch;margin-block:1.5rem}
.v .cs-open .outcome{font:400 var(--step-2)/1.2 var(--display);letter-spacing:-.02em;max-inline-size:30ch}
.v .cs-cover{aspect-ratio:21/9;overflow:hidden;border-radius:var(--radius);background:var(--card)}
.v .cs-cover img{inline-size:100%;block-size:100%;object-fit:cover}
.v .glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));border-block-end:1px solid var(--line)}
.v .glance div{padding:1.25rem var(--gutter) 1.25rem 0;border-block-end:1px solid var(--line)}
.v .glance dt{color:var(--mid)}
.v .glance dd{font:500 1rem/1.4 var(--display);margin-block-start:.35rem}
.v .stats{display:grid;gap:1rem;padding-block:var(--space-l) 0}
@media (min-width:52em){.v .stats{grid-template-columns:repeat(3,1fr)}}
.v .stats li{background:var(--card);border-radius:var(--radius);padding:1.5rem;min-block-size:14rem;display:flex;flex-direction:column;justify-content:space-between;gap:1rem}
.v .stats strong{font:900 var(--step-2)/1 var(--display);letter-spacing:-.03em}
.v .stats small{color:var(--mid)}
.v .prose{max-inline-size:40rem;margin-inline:auto;padding-block:var(--space-l)}
.v .prose h2{font:700 var(--step-2)/1.1 var(--display);letter-spacing:-.025em;margin-block:2.5em .6em}
.v .prose h2:first-child{margin-block-start:0}
.v .prose p + p{margin-block-start:1em}
.v .prose figure{margin-block:2.5rem;margin-inline:calc(-1 * min(8rem, var(--gutter)))}
.v .prose figure .frame{border-radius:var(--radius);overflow:hidden;aspect-ratio:3/2;background:var(--card)}
.v .prose figure img{inline-size:100%;block-size:100%;object-fit:cover}
.v .prose figcaption{margin-block-start:.75rem;color:var(--mid)}
.v .prose a{text-underline-offset:.2em}

/* C1/C2: case-study image sits under the opener as a wide cover */
.c1 .cs-open,.c2 .cs-open{display:flex;flex-direction:column-reverse}
.c1 .cs-open .duo,.c2 .cs-open .duo{aspect-ratio:21/9;margin:0 var(--gutter) var(--gutter);border-radius:var(--radius);overflow:hidden}
.c1 .cs-open .duo img,.c2 .cs-open .duo img{inline-size:100%;block-size:100%;object-fit:cover}

/* =================== C1 · Surface: yellow is only ever a background =================== */
.c1 .hl{background:var(--yellow);color:var(--on-yellow);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding-inline:.06em}
.c1 .hero h1 .hl{padding-inline:.08em .04em;background:linear-gradient(var(--yellow),var(--yellow)) 0 72%/100% .8em no-repeat}
.c1 .logo span{background:var(--yellow);color:var(--on-yellow);padding-inline:.15em;margin-inline-start:.1em}
.c1 .prose a,.c1 .statement a{text-decoration-thickness:2px}
.c1 .prose a:hover,.c1 .statement a:hover{background:var(--yellow);color:var(--on-yellow)}
.c1 .cs-open{background:var(--yellow);color:var(--on-yellow)}
.c1 .stats li:first-child{background:var(--yellow);color:var(--on-yellow)}
.c1 .stats li:first-child small{color:var(--on-yellow)}
.c1 footer{background:var(--yellow);color:var(--on-yellow)}
.c1 .btn{display:inline-block;margin-block-start:2rem;background:var(--fg);color:var(--bg);padding:.9rem 1.4rem;border-radius:999px;text-decoration:none;font:600 1rem/1 var(--body)}

/* =================== C2 · Marker: yellow only as small marks; ink carries the meaning =================== */
.c2 .stop{color:var(--yellow);-webkit-text-stroke:.012em var(--fg)}
.dark .c2 .stop{-webkit-text-stroke:0}
.c2 .mark{background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 92%,transparent 92%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.dark .c2 .mark{background:none;color:var(--yellow)}
.c2 .head-row{border-block-start:4px solid var(--yellow);box-shadow:0 -1px 0 var(--fg)}
.c2 .prose a,.c2 .statement a{text-decoration-color:var(--fg);text-decoration-thickness:1px}
.c2 .prose a:hover,.c2 .statement a:hover{text-decoration-color:var(--yellow);text-decoration-thickness:.3em;text-underline-offset:-.05em;text-decoration-skip-ink:none}
.dark .c2 .prose a,.dark .c2 .statement a{color:var(--yellow);text-decoration-color:var(--yellow)}
.c2 .cs-open{border-block-end:1px solid var(--fg)}
.c2 .cs-open .wrap{border-inline-start:10px solid var(--yellow);margin-inline-start:var(--gutter);padding-inline-start:calc(var(--gutter) - 10px);margin-block:var(--gutter)}
.c2 .stats strong::before{content:"";display:block;inline-size:2.5rem;block-size:.4rem;background:var(--yellow);margin-block-end:1rem;outline:1px solid var(--fg)}
.dark .c2 .stats strong::before{outline:0}
.c2 footer{border-block-start:1px solid var(--fg)}
.c2 footer .big a:hover .mark{color:inherit}
.c2 .btn{display:inline-block;margin-block-start:2rem;background:var(--fg);color:var(--bg);padding:.9rem 1.4rem;border-radius:999px;text-decoration:none;font:600 1rem/1 var(--body);box-shadow:inset 0 -4px 0 var(--yellow)}

/* =================== C3 · Duotone: yellow lives in the photography =================== */
.c3{--accent-text:#6b5600}
.dark .c3{--accent-text:var(--yellow)}
.c3 .duo{background:var(--yellow);position:relative}
.c3 .duo img{filter:grayscale(1) contrast(1.15) brightness(1.05);mix-blend-mode:multiply}
@media (prefers-reduced-motion:no-preference){.c3 .card a:hover .duo img{filter:none;mix-blend-mode:normal;transition:filter .3s}}
.c3 .logo span,.c3 .stop{color:var(--accent-text)}
.c3 .mono.accent,.c3 .head-row .mono:last-child{color:var(--accent-text)}
.c3 .prose a,.c3 .statement a{color:var(--accent-text);text-decoration-thickness:1px}
.c3 .cs-open{position:relative;color:#f7f4ed;background:#161412}
.c3 .cs-open .duo{position:absolute;inset:0;overflow:hidden}
.c3 .cs-open .duo img{inline-size:100%;block-size:100%;object-fit:cover;opacity:.55}
.c3 .cs-open .wrap{position:relative;min-block-size:min(80vh,44rem);display:flex;flex-direction:column;justify-content:flex-end}
.c3 .cs-open h1,.c3 .cs-open .outcome{background:#161412;box-decoration-break:clone;-webkit-box-decoration-break:clone;display:inline;padding-inline:.15em}
.c3 .cs-open .outcome{color:var(--yellow)}
.c3 footer{background:#161412;color:#f1ede5}
.c3 footer .big a{color:var(--yellow)}
.c3 .btn{display:inline-block;margin-block-start:2rem;background:var(--fg);color:var(--bg);padding:.9rem 1.4rem;border-radius:999px;text-decoration:none;font:600 1rem/1 var(--body)}

/* ---------- prototype chrome (NOT part of the design) ---------- */
.proto-bar{position:fixed;inset-block-end:16px;inset-inline-start:50%;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:#ff00aa;color:#fff;font:600 13px/1 "JetBrains Mono",monospace;box-shadow:0 6px 24px #0006,0 0 0 2px #fff;max-inline-size:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.proto-bar button{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px}
.proto-bar button:hover,.proto-bar button:focus-visible{background:#0003}
.proto-bar button:focus-visible{outline:2px solid #fff}
.proto-bar output{padding-inline:8px;min-inline-size:13ch;text-align:center}
.proto-contrast{position:fixed;inset-block-end:76px;inset-inline-end:16px;z-index:999;background:#111;color:#eee;font:12px/1.5 "JetBrains Mono",monospace;padding:12px 14px;border-radius:12px;box-shadow:0 6px 24px #0008;max-inline-size:min(26rem,calc(100vw - 32px))}
.proto-contrast[hidden]{display:none}
.proto-contrast table{border-collapse:collapse}
.proto-contrast td{padding:2px 6px;white-space:nowrap}
.proto-contrast .sw{display:inline-block;inline-size:12px;block-size:12px;border:1px solid #888;vertical-align:-2px;margin-inline-end:2px}
.proto-contrast .ok{color:#7ee787}.proto-contrast .lg{color:#e3b341}.proto-contrast .no{color:#ff7b72}
</style>
</head>

<script>
(() => {
  const tpl = document.getElementById('page');
  const variants = [...document.querySelectorAll('.v')];
  variants.forEach(v => v.append(tpl.content.cloneNode(true)));
  // only the duotone variant treats images; the others keep the .duo hook inert
  const keys = variants.map(v => v.dataset.key);
  const out = document.querySelector('.proto-bar output');
  const themeBtn = document.querySelector('[data-theme-btn]');
  const cBtn = document.querySelector('[data-contrast-btn]');
  const panel = document.querySelector('.proto-contrast');
  const themes = ['light', 'dark', 'auto'];
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const params = new URLSearchParams(location.search);
  let current = keys.includes(params.get('variant')) ? params.get('variant') : 'C1';
  let theme = themes.includes(params.get('theme')) ? params.get('theme') : 'light';
  let showContrast = params.get('contrast') === '1';

  const lum = rgb => { const c = rgb.map(v => v / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
  const parse = s => { s = s.trim(); if (s.startsWith('#')) { if (s.length === 4) s = '#' + [...s.slice(1)].map(c => c + c).join(''); return [1,3,5].map(i => parseInt(s.slice(i, i+2), 16)); } const m = s.match(/[\d.]+/g); return m ? m.slice(0,3).map(Number) : [0,0,0]; };
  const ratio = (a, b) => { const [x, y] = [lum(parse(a)), lum(parse(b))].sort((p, q) => q - p); return (x + .05) / (y + .05); };

  function renderContrast(v) {
    const cs = getComputedStyle(v);
    const t = n => cs.getPropertyValue(n).trim();
    const bg = t('--bg'), card = t('--card');
    const accentRaw = getComputedStyle(v.querySelector('.hero-foot .mono')).color;
    const pairs = [
      ['text / bg', t('--fg'), bg, 4.5],
      ['muted / bg', t('--mid'), bg, 4.5],
      ['muted / card', t('--mid'), card, 4.5],
      ['ink / yellow', t('--on-yellow'), t('--yellow'), 4.5],
      ['yellow / bg', t('--yellow'), bg, 3],
      ['accent text / bg', accentRaw, bg, 4.5],
      ['line / bg (decor)', t('--line'), bg, 0],
    ];
    panel.innerHTML = `<strong>${current} · ${document.body.classList.contains('dark') ? 'dark' : 'light'}</strong><table>${pairs.map(([n, a, b, need]) => {
      const r = ratio(a, b); const cls = need === 0 ? '' : r >= 4.5 ? 'ok' : r >= 3 ? 'lg' : 'no';
      const verdict = need === 0 ? 'decorative' : r >= 4.5 ? 'AA text' : r >= 3 ? 'large/UI only' : 'fails';
      return `<tr><td><span class="sw" style="background:${a}"></span><span class="sw" style="background:${b}"></span></td><td>${n}</td><td class="${cls}">${r.toFixed(2)}:1</td><td class="${cls}">${verdict}</td></tr>`;
    }).join('')}</table>`;
  }

  function render() {
    variants.forEach(v => { v.hidden = v.dataset.key !== current; });
    const v = variants.find(v => v.dataset.key === current);
    out.textContent = `${current} (${v.dataset.name})`;
    document.body.classList.toggle('dark', theme === 'dark' || (theme === 'auto' && mq.matches));
    themeBtn.textContent = `theme: ${theme}`;
    cBtn.setAttribute('aria-pressed', showContrast);
    panel.hidden = !showContrast;
    if (showContrast) renderContrast(v);
    params.set('variant', current); params.set('theme', theme); params.set('contrast', showContrast ? '1' : '0');
    history.replaceState(null, '', `?${params}${location.hash}`);
  }
  const step = n => { current = keys[(keys.indexOf(current) + n + keys.length) % keys.length]; render(); };
  const cycleTheme = () => { theme = themes[(themes.indexOf(theme) + 1) % themes.length]; render(); };

  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => step(+b.dataset.step)));
  themeBtn.addEventListener('click', cycleTheme);
  cBtn.addEventListener('click', () => { showContrast = !showContrast; render(); });
  mq.addEventListener('change', render);
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 't' || e.key === 'T') cycleTheme();
    else if (e.key === 'c' || e.key === 'C') { showContrast = !showContrast; render(); }
  });
  render();
})();
</script>
</body>
</html>
