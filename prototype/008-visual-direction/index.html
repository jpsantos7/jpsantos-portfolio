<!doctype html>
<!--
  PROTOTYPE, round 8 — throwaway. Ticket 008 "Visual direction: type, space, colour, layout".
  Round 1 (e737601): owner picked C Hybrid. Round 2 (7d9107d): owner picked C3 Duotone.
  Round 3 (0c50389): owner picked the warm yellow (#f2c200) and asked to mix D1 Contained and D2 Bleed.
  Round 4 (54e95c8): owner chose all Bleed, and disliked the mustard (#6b5600) text accent in light mode.
  Round 5 (f9aa422): owner picked B2 Chips, brighter photo mid-tones (gamma .5) and reveal-colour hover.
  Round 6: everything from round 5 B2 is fixed; the variants differ only in TYPE (owner is tired of Hanken Grotesk;
  free fonts, not only Google): F0 Hanken+Inter (baseline), F1 Cabinet Grotesk+Satoshi, F2 Clash Display+General Sans,
  F3 Zodiak serif+Switzer, F4 Bricolage Grotesque+Geist+Geist Mono, F5 Panchang (wide)+Supreme.
  Round 6 (4cf19b7): owner picked F4 Bricolage Grotesque + Geist (+ Geist Mono), ink accents (B1, no chips or marks),
  brighter photo mid-tones (.5) and reveal-colour hover. Those are now fixed.
  Round 7: variants differ only in MOTION. Click a Work row to open the Case study; the logo or "Work" goes back.
    M1 Quiet       — page crossfade, colour reveal and underline fade on hover. Nothing moves on load or scroll.
    M2 Considered  — M1 + the Work photo morphs into the Case study cover, hero text rises in, rows rise in on scroll.
    M3 Expressive  — M2 + photos wipe up into place, the page lifts out and the new one rises in.
  Reduced motion (system, or tune > Reduced motion) keeps only 150ms fades on every level.
  Round 7 (b78bfe6, 81b01ad): owner picked M2 Considered motion (now fixed); Geist Italic did not work as emphasis.
  Round 8: variants differ only in the EMPHASIS (italic) face next to Bricolage: E1 Fraunces, E2 Instrument Serif,
  E3 Newsreader, E4 Gambetta, E5 Sentient. The hero headline now carries an italic word too.
  Round 5 notes: layout is all Bleed (hero portrait off the edge, big Work rows, photo band, full-bleed Case study opener).
  The variants differ only in what replaces the mustard accents in LIGHT mode (dark mode keeps yellow text, 10:1):
    B1 Ink    — no colour on text; accents are plain ink. Yellow lives in the photos and the footer only.
    B2 Chips  — yellow as a surface: labels become yellow tags with ink text; links get a yellow highlighter band.
    B3 Marks  — yellow as small outlined marks: full stop and label squares outlined in ink; links get a yellow underline band.
  Photos now default to brighter mid-tones (gamma .5) so the warm duotone reads less brown; "tune" > Photo mid-tones.
  "tune" still swaps yellow (default warm #f2c200), shadow tone, dark-mode duotone and hover. Theme: button or T.
  Images: Unsplash stand-ins (hotlinked). Copy is placeholder. Open this file in a browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE 008 · Visual direction · round 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@1,9..144,300..600&family=Newsreader:ital,opsz,wght@1,6..72,400..500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<!-- Fontshare (ITF Free Font License): one link per family -->
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=gambetta@400i&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=sentient@400i&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body,h1,h2,h3,p,dl,dd,figure,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
img{display:block;max-inline-size:100%;block-size:auto}
a{color:inherit}
.v[hidden]{display:none!important}
.visually-hidden{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.proto-divider{font:500 12px/1 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:10px;background:repeating-linear-gradient(45deg,#ff00aa22 0 10px,transparent 10px 20px);color:#a0006a;border-block:1px dashed #a0006a;margin:0}

/* =================== shared: Hybrid type + duotone rule =================== */
.v{
  --bg:#f7f4ed; --fg:#161412; --mid:#5a544f; --line:#dcd6ca; --card:#ece7dd;
  --yellow:#f2c200; --shadow:#161412; --on-yellow:#161412; --accent-text:#6b5600;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace; --italic:"Instrument Serif",Georgia,serif;
  --dw:800; --dw2:700; --dt:.6; --dsz:1;
  --step-0:clamp(1rem,.95rem + .3vw,1.2rem);
  --step-2:clamp(1.6rem,1.2rem + 1.8vw,2.8rem);
  --step-4:clamp(2.4rem,1rem + 5vw,6rem);
  --step-6:clamp(3.6rem,1rem + 13vw,17rem);
  --gutter:clamp(1rem,4vw,3.5rem); --space-l:clamp(3.5rem,2rem + 7vw,10rem);
  --radius:1.25rem;
  background:var(--bg); color:var(--fg); font:400 var(--step-0)/1.6 var(--body);
}
.dark .v{--bg:#1f1d1a; --fg:#f1ede5; --mid:#a9a198; --line:#3a3631; --card:#2a2723; --accent-text:var(--yellow)}
.v :focus-visible{outline:3px solid var(--fg);outline-offset:3px;box-shadow:0 0 0 6px var(--yellow)}
.v .wrap{padding-inline:var(--gutter)}
.v .mono{font:500 .75rem/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.v .accent{color:var(--accent-text)}
.v header.site .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:1.25rem;flex-wrap:wrap;gap:1rem}
.v .logo{font:var(--dw) 1.25rem/1 var(--display);letter-spacing:calc(-.03em * var(--dt));text-decoration:none}
.v .stop{color:var(--accent-text)}
.v nav ul{display:flex;gap:clamp(1rem,3vw,2.5rem)}
.v nav a{text-decoration:none}
.v nav a:hover{text-decoration:underline;text-underline-offset:.3em}
.v h1.display{font:var(--dw) var(--step-6)/.86 var(--display);letter-spacing:calc(-.055em * var(--dt));margin-inline-start:-.04em}
.v .lead{font:400 var(--step-2)/1.2 var(--display);letter-spacing:calc(-.02em * var(--dt));max-inline-size:26ch}
.v em{font:italic 400 var(--italic-size,1.1em)/1 var(--italic);letter-spacing:-.01em}
.v .head-row{display:flex;justify-content:space-between;align-items:baseline;padding-block:1rem;border-block-start:1px solid var(--fg)}
.v .prose a,.v .statement a{color:var(--accent-text);text-underline-offset:.2em}
.v .btn{display:inline-block;margin-block-start:2rem;background:var(--fg);color:var(--bg);padding:.9rem 1.4rem;border-radius:999px;text-decoration:none;font:600 1rem/1 var(--body)}
.v footer.site{background:#161412;color:#f1ede5}
.v footer.site .wrap{padding-block:var(--space-l) 1.5rem}
.v footer.site .big{font:var(--dw) var(--step-6)/.86 var(--display);letter-spacing:calc(-.055em * var(--dt))}
.v footer.site .big a{text-decoration:none;color:var(--yellow)}
.v footer.site .big a:hover{text-decoration:underline;text-decoration-thickness:.05em;text-underline-offset:.08em}
.v footer.site .row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-block-start:var(--space-l)}

/* the duotone itself: SVG filter (#duo-light / #duo-dark), shadows -> --shadow, highlights -> --yellow */
.v .ph{overflow:hidden;background:var(--yellow)}
.v .ph img{inline-size:100%;block-size:100%;object-fit:cover;filter:url(#duo-light)}
.dark .v .ph img{filter:url(#duo-dark)}
@media (prefers-reduced-motion:no-preference){.v .ph img{transition:filter .35s ease,transform .5s cubic-bezier(.2,.7,.2,1)}}
body[data-hover="reveal"] .v a:hover .ph img{filter:none}
body[data-hover="zoom"] .v a:hover .ph img{transform:scale(1.04)}

/* shared case study bits */
.v .glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));border-block-end:1px solid var(--line)}
.v .glance div{padding:1.25rem var(--gutter) 1.25rem 0;border-block-end:1px solid var(--line)}
.v .glance dt{color:var(--mid)}
.v .glance dd{font:500 1rem/1.4 var(--display);margin-block-start:.35rem}
.v .stats{display:grid;gap:1rem;padding-block:var(--space-l) 0}
@media (min-width:52em){.v .stats{grid-template-columns:repeat(3,1fr)}}
.v .stats li{background:var(--card);border-radius:var(--radius);padding:1.5rem;min-block-size:14rem;display:flex;flex-direction:column;justify-content:space-between;gap:1rem}
.v .stats strong{font:var(--dw) var(--step-2)/1 var(--display);letter-spacing:calc(-.03em * var(--dt))}
.v .stats small{color:var(--mid)}
.v .prose{max-inline-size:40rem;margin-inline:auto;padding-block:var(--space-l)}
.v .prose h2{font:var(--dw2) var(--step-2)/1.1 var(--display);letter-spacing:calc(-.025em * var(--dt));margin-block:2.5em .6em}
.v .prose h2:first-child{margin-block-start:0}
.v .prose p + p{margin-block-start:1em}
.v .prose figure{margin-block:2.5rem;margin-inline:calc(-1 * min(8rem, var(--gutter)))}
.v .prose figure .ph{aspect-ratio:3/2;border-radius:var(--radius)}
.v .prose figcaption{margin-block-start:.75rem;color:var(--mid)}
.v .cs-open h1{font:var(--dw) var(--step-4)/.9 var(--display);letter-spacing:calc(-.045em * var(--dt));max-inline-size:16ch;margin-block:1.5rem}
.v .cs-open .outcome{font:400 var(--step-2)/1.25 var(--display);letter-spacing:calc(-.02em * var(--dt));max-inline-size:30ch}

/* =================== parts: Contained =================== */
.hero-c{padding-block:calc(var(--space-l)/2) var(--space-l)}
.hero-c .hero-foot{display:grid;gap:1.5rem;margin-block-start:clamp(2rem,5vw,4rem)}
@media (min-width:52em){.hero-c .hero-foot{grid-template-columns:1fr 1fr 1fr}.hero-c .hero-foot .lead{grid-column:2/4}}
.cards{display:grid;gap:clamp(1rem,2vw,2rem);padding-block:1.5rem var(--space-l)}
@media (min-width:52em){.cards{grid-template-columns:repeat(3,1fr)}}
.card a{text-decoration:none;display:block}
.card .ph{aspect-ratio:3/4;border-radius:var(--radius)}
.card h3{margin-block-start:1rem;font:700 var(--step-0)/1.3 var(--display)}
.card a:hover h3{text-decoration:underline;text-underline-offset:.25em}
.card p{color:var(--mid);font-size:.95rem}
.card .mono{display:block;margin-block-start:.5rem;color:var(--mid)}
.statement{padding-block:var(--space-l);border-block-start:1px solid var(--fg);display:grid;gap:2rem;align-items:end}
@media (min-width:52em){.statement{grid-template-columns:2fr 1fr}}
.statement p{font:var(--dw2) var(--step-2)/1.15 var(--display);letter-spacing:calc(-.025em * var(--dt));max-inline-size:30ch}
.statement .ph{aspect-ratio:4/5;border-radius:var(--radius);max-inline-size:22rem}
.cs-c .cs-open{display:flex;flex-direction:column-reverse}
.cs-c .cs-open .wrap{padding-block:var(--space-l) 2rem}
.cs-c .cs-open .ph{aspect-ratio:21/9;border-radius:var(--radius);margin-inline:var(--gutter)}

/* =================== parts: Bleed =================== */
.hero-b{display:grid;gap:2rem;padding-block-start:calc(var(--space-l)/3)}
@media (min-width:60em){.hero-b{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;align-items:end;min-block-size:min(88vh,60rem)}}
.hero-b .text{padding-inline:var(--gutter);padding-block-end:var(--space-l);position:relative;z-index:1}
.hero-b h1.display{font-size:calc(clamp(3.4rem,1rem + 9vw,12rem) * var(--dsz))}
@media (min-width:60em){.hero-b h1.display{margin-inline-end:-30%}}
.hero-b .lead{margin-block-start:2rem}
.hero-b .ph{block-size:100%;min-block-size:24rem}
@media (max-width:59.99em){.hero-b .ph{aspect-ratio:4/3;min-block-size:0;block-size:auto}}
.rows{padding-block:1.5rem var(--space-l)}
.row a{display:grid;gap:1.5rem;text-decoration:none;padding-block:clamp(2rem,4vw,4rem);border-block-end:1px solid var(--line)}
@media (min-width:52em){.row a{grid-template-columns:7fr 5fr;gap:clamp(2rem,4vw,4rem);align-items:center}.row:nth-child(even) .ph{order:2}}
.row .ph{aspect-ratio:16/10}
.row h3{font:var(--dw) var(--step-4)/.92 var(--display);letter-spacing:calc(-.04em * var(--dt));margin-block:.75rem 1rem}
.row a:hover h3{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.1em}
.row p{color:var(--mid);max-inline-size:36ch}
.row .meta{display:block;margin-block-start:1rem;color:var(--mid)}
.band{position:relative;min-block-size:min(80vh,40rem);display:grid;align-items:end}
.band .ph{position:absolute;inset:0}
.band .inner{position:relative;padding:var(--space-l) var(--gutter) var(--gutter)}
.band p{display:inline;background:#161412;color:#f1ede5;font:var(--dw2) var(--step-2)/1.35 var(--display);letter-spacing:calc(-.02em * var(--dt));padding:.05em .2em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.band p a{color:var(--yellow)}
.cs-b .cs-open{position:relative;color:#f7f4ed;background:#161412}
.cs-b .cs-open .ph{position:absolute;inset:0}
.cs-b .cs-open .ph img{opacity:.6}
.cs-b .cs-open .wrap{position:relative;min-block-size:min(85vh,48rem);display:flex;flex-direction:column;justify-content:flex-end;padding-block:var(--space-l)}
.cs-b .cs-open h1 span,.cs-b .cs-open .outcome span{background:#161412;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding-inline:.15em}
.cs-b .cs-open .outcome{color:var(--yellow)}
.cs-b .prose figure .ph{border-radius:0;aspect-ratio:21/9}

/* =================== M3 · bleed scale, contained shape =================== */
.round .hero-b .ph{border-radius:var(--radius);margin-inline-end:var(--gutter);margin-block-end:var(--gutter)}
@media (max-width:59.99em){.round .hero-b .ph{margin-inline:var(--gutter)}}
.round .row .ph{border-radius:var(--radius)}
.round .band{margin-inline:var(--gutter);border-radius:var(--radius);overflow:hidden}
.round .cs-b .cs-open{margin:var(--gutter) var(--gutter) 0;border-radius:var(--radius);overflow:hidden}
.round .cs-b .prose figure .ph{border-radius:var(--radius)}

/* =================== round 5: light-mode accent without mustard =================== */
/* dark mode keeps yellow text accents (10:1); these rules change light mode only */
body:not(.dark) .acc-ink,body:not(.dark) .acc-chip,body:not(.dark) .acc-marker{--accent-text:var(--fg)}
/* B2 chips: yellow is a surface behind ink, in both themes */
.acc-chip .mono.accent{background:var(--yellow);color:var(--on-yellow);padding:.25em .5em;display:inline-block}
.acc-chip .prose a{color:var(--fg);text-decoration:none;background:linear-gradient(transparent 55%,var(--yellow) 55%);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.acc-chip .prose a:hover{background:var(--yellow);color:var(--on-yellow)}
/* B3 marks: yellow as small outlined marks; ink carries the meaning */
body:not(.dark) .acc-marker .stop{color:var(--yellow);-webkit-text-stroke:.015em var(--fg);paint-order:stroke fill}
.acc-marker .mono.accent::before{content:"";display:inline-block;inline-size:.7em;block-size:.7em;background:var(--yellow);box-shadow:0 0 0 1px var(--fg);margin-inline-end:.6em;vertical-align:-.05em}
body:not(.dark) .acc-marker .prose a{color:var(--fg);text-decoration-color:var(--fg);text-decoration-thickness:1px;text-underline-offset:.15em;box-shadow:inset 0 -.3em 0 var(--yellow)}

/* ---------- prototype chrome (NOT part of the design) ---------- */
.proto-bar{position:fixed;inset-block-end:16px;inset-inline-start:50%;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:#ff00aa;color:#fff;font:600 13px/1 "JetBrains Mono",monospace;box-shadow:0 6px 24px #0006,0 0 0 2px #fff;max-inline-size:calc(100vw - 16px);flex-wrap:wrap;justify-content:center}
.proto-bar button{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px}
.proto-bar button:hover,.proto-bar button:focus-visible{background:#0003}
.proto-bar button:focus-visible{outline:2px solid #fff}
.proto-bar output{padding-inline:8px;min-inline-size:14ch;text-align:center}
.proto-panel{position:fixed;inset-block-end:76px;z-index:999;background:#111;color:#eee;font:12px/1.5 "JetBrains Mono",monospace;padding:12px 14px;border-radius:12px;box-shadow:0 6px 24px #0008;max-inline-size:min(26rem,calc(100vw - 32px))}
.proto-panel[hidden]{display:none}
.proto-contrast{inset-inline-end:16px}
.proto-tune{inset-inline-start:16px}
.proto-panel table{border-collapse:collapse}
.proto-panel td{padding:2px 6px;white-space:nowrap}
.proto-panel .sw{display:inline-block;inline-size:12px;block-size:12px;border:1px solid #888;vertical-align:-2px;margin-inline-end:2px}
.proto-panel .ok{color:#7ee787}.proto-panel .lg{color:#e3b341}.proto-panel .no{color:#ff7b72}
.proto-tune fieldset{border:0;padding:0;margin:0 0 10px}
.proto-tune legend{padding:0;margin-block-end:4px;color:#aaa}
.proto-tune label{display:inline-flex;align-items:center;gap:4px;margin-inline-end:10px;cursor:pointer}

/* =================== round 7: motion =================== */
/* One easing family. Reduced motion (system setting or tune > Reduced motion) keeps only short fades. */
:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in-out:cubic-bezier(.65,0,.35,1)}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes rise-lg{from{opacity:0;transform:translateY(32px)}}
@keyframes lift-out{to{opacity:0;transform:translateY(-12px)}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0)}}

/* page transitions (prototype: same-document; the Site would use cross-document @view-transition, no JS) */
::view-transition-old(root){animation:fade-out .2s ease both}
::view-transition-new(root){animation:fade-in .25s ease both}
::view-transition-group(work-img){animation-duration:.55s;animation-timing-function:var(--ease-in-out)}
::view-transition-old(work-img),::view-transition-new(work-img){animation-duration:.55s;block-size:100%;object-fit:cover;overflow:clip}
html[data-motion="3"]::view-transition-old(root){animation:lift-out .25s var(--ease-out) both}
html[data-motion="3"]::view-transition-new(root){animation:rise-lg .5s var(--ease-out) .1s both}
html.rm::view-transition-old(root){animation:fade-out .15s ease both}
html.rm::view-transition-new(root){animation:fade-in .15s ease both}
@media (prefers-reduced-motion:reduce){
  ::view-transition-old(root){animation:fade-out .15s ease both !important}
  ::view-transition-new(root){animation:fade-in .15s ease both !important}
}

@media (prefers-reduced-motion:no-preference){
  /* all levels: colour reveal on photo hover (round 5) + link underlines that fade in */
  html:not(.rm) .row h3{text-decoration:underline;text-decoration-thickness:.06em;text-underline-offset:.1em;text-decoration-color:transparent;transition:text-decoration-color .3s ease}
  html:not(.rm) .row a:hover h3{text-decoration-color:currentColor}

  /* M2 + M3: entrance, scroll reveal, case study opener, slow photo drift on hover */
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .hero-b .text > *{animation:rise .7s var(--ease-out) both}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .hero-b .text > :nth-child(2){animation-delay:.08s}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .hero-b .text > :nth-child(3){animation-delay:.16s}
  html:not(.rm)[data-motion="2"] .hero-b .ph{animation:fade-in 1s ease .1s both}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .cs-open .wrap > *{animation:rise .7s var(--ease-out) .2s both}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .cs-open .wrap > :nth-child(2){animation-delay:.28s}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .cs-open .wrap > :nth-child(3){animation-delay:.36s}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .row .ph img{transition:filter .35s ease,transform 1.2s var(--ease-out)}
  html:not(.rm):is([data-motion="2"],[data-motion="3"]) .row a:hover .ph img{transform:scale(1.03)}
  @supports (animation-timeline:view()){
    html:not(.rm):is([data-motion="2"],[data-motion="3"]) .row,
    html:not(.rm):is([data-motion="2"],[data-motion="3"]) .glance,
    html:not(.rm):is([data-motion="2"],[data-motion="3"]) .stats li{animation:rise linear both;animation-timeline:view();animation-range:entry 5% entry 60%}
  }

  /* M3 only: photos wipe up into place, bigger headline rise */
  html:not(.rm)[data-motion="3"] .hero-b h1.display{animation-name:rise-lg}
  html:not(.rm)[data-motion="3"] .hero-b .ph{animation:wipe 1.1s var(--ease-in-out) .15s both}
  @supports (animation-timeline:view()){
    html:not(.rm)[data-motion="3"] .row .ph,
    html:not(.rm)[data-motion="3"] .band .ph,
    html:not(.rm)[data-motion="3"] .prose figure .ph{animation:wipe linear both;animation-timeline:view();animation-range:entry 0% cover 40%}
  }
}
</style>
</head>
<body data-hover="reveal">

<!-- duotone filters: table values are rewritten by the tune panel -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="duo-light" color-interpolation-filters="sRGB">
    <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0"/>
    <feComponentTransfer><feFuncR type="gamma" exponent=".7"/><feFuncG type="gamma" exponent=".7"/><feFuncB type="gamma" exponent=".7"/></feComponentTransfer>
    <feComponentTransfer><feFuncR type="table"/><feFuncG type="table"/><feFuncB type="table"/></feComponentTransfer>
  </filter>

    <feComponentTransfer><feFuncR type="gamma" exponent=".7"/><feFuncG type="gamma" exponent=".7"/><feFuncB type="gamma" exponent=".7"/></feComponentTransfer>
    <feComponentTransfer><feFuncR type="table"/><feFuncG type="table"/><feFuncB type="table"/></feComponentTransfer>

<div class="proto-bar" role="toolbar" aria-label="Prototype variant switcher">
  <button type="button" data-step="-1" aria-label="Previous variant">←</button>
  <output></output>
  <button type="button" data-step="1" aria-label="Next variant">→</button>
  <button type="button" data-theme-btn>theme: light</button>
  <button type="button" data-tune-btn aria-pressed="false">tune</button>
  <button type="button" data-contrast-btn aria-pressed="false">contrast</button>
</div>
<script>
(() => {
  // Unsplash stand-ins (hotlinked). a/b/c = Work, p = portrait, s = case-study cover, f = figure, t = band
  const IMG = { a:'1460925895917-afdab827c52f', b:'1551288049-bebda4e38f71', c:'1498050108023-c5249f4df085',
                p:'1500648767791-00dcc994a43e', s:'1497366216548-37526070297c', f:'1517694712202-14dd9538aa97', t:'1522202176988-66273c2fd55f' };
  const src = (k, w, h) => `https://images.unsplash.com/photo-${IMG[k]}?w=${w}&h=${h}&fit=crop&q=70&auto=format`;

  const variants = [...document.querySelectorAll('.v')];
  for (const v of variants) {
    const key = v.dataset.key.toLowerCase();
    const tpl = id => document.getElementById('t-' + id).content.cloneNode(true);
    const page = name => { const d = document.createElement('div'); d.dataset.page = name; return d; };
    const home = page('home'), cs = page('cs'); cs.hidden = true;
    const main = document.createElement('main');
    v.dataset.parts.split(' ').forEach(p => main.append(tpl(p)));
    const fc = tpl('footer-cs'), footer = fc.querySelector('footer'), csMain = document.createElement('main');
    csMain.append(fc.querySelector('article'));
    home.append(tpl('header'), main, footer);
    cs.append(tpl('header'), csMain, footer.cloneNode(true));
    v.append(home, cs);
    v.querySelectorAll('[id="work-h"]').forEach(e => e.id = key + '-work');
    v.querySelectorAll('[aria-labelledby="work-h"]').forEach(e => e.setAttribute('aria-labelledby', key + '-work'));
    v.querySelectorAll('img[data-img]').forEach(i => { i.width = i.dataset.w; i.height = i.dataset.h; i.loading = 'lazy'; i.src = src(i.dataset.img, i.dataset.w, i.dataset.h); });
  }

  // "navigation" between the two views, through a view transition when the browser has one
  const rmq = matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => rmq.matches || document.documentElement.classList.contains('rm');
  let lastPh = null, savedY = 0;
  function go(v, to, ph) {
    const home = v.querySelector('[data-page=home]'), cs = v.querySelector('[data-page=cs]');
    if ((to === 'cs') === !cs.hidden) return;
    const cover = cs.querySelector('.cs-open .ph');
    const morph = v.dataset.motion !== '1' && !reduced();
    if (to === 'cs') { savedY = scrollY; lastPh = ph || null; }
    const from = to === 'cs' ? lastPh : cover, dest = to === 'cs' ? cover : lastPh;
    if (morph && from) from.style.viewTransitionName = 'work-img';
    const swap = () => {
      if (from) from.style.viewTransitionName = '';
      home.hidden = to !== 'home'; cs.hidden = to !== 'cs';
      if (morph && dest) dest.style.viewTransitionName = 'work-img';
      scrollTo(0, to === 'cs' ? 0 : savedY);
    };
    if (!document.startViewTransition) return swap();
    document.startViewTransition(swap).finished.finally(() => { if (dest) dest.style.viewTransitionName = ''; });
  }
  document.addEventListener('click', e => {
    const a = e.target.closest('.v a[href]'); if (!a) return;
    const v = a.closest('.v'), href = a.getAttribute('href');
    if (href === '#cs') { e.preventDefault(); go(v, 'cs', a.querySelector('.ph')); }
    else if (a.matches('.logo') || a.textContent.trim() === 'Work') { e.preventDefault(); go(v, 'home'); }
    else if (href === '#') e.preventDefault();
  });

  const keys = variants.map(v => v.dataset.key);
  const $ = s => document.querySelector(s);
  const out = $('.proto-bar output'), themeBtn = $('[data-theme-btn]'), tuneBtn = $('[data-tune-btn]'), cBtn = $('[data-contrast-btn]');
  const tune = $('.proto-tune'), contrast = $('.proto-contrast');
  const themes = ['light', 'dark', 'auto'];
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const params = new URLSearchParams(location.search);
  const st = {
    v: keys.includes(params.get('variant')) ? params.get('variant') : 'E1',
    theme: themes.includes(params.get('theme')) ? params.get('theme') : 'light',
    tune: params.get('tune') === '1', contrast: params.get('contrast') === '1',
    yellow: params.get('yellow') || '#f2c200', shadow: params.get('shadow') || '#161412',
    darkduo: params.get('darkduo') || 'same', lift: params.get('lift') || '.5', hover: params.get('hover') || 'reveal', rm: params.get('rm') === 'on' ? 'on' : 'system',
  };
  for (const n of ['yellow', 'shadow', 'darkduo', 'hover', 'lift', 'rm']) { const r = tune.querySelector(`input[name=${n}][value="${st[n]}"]`); if (r) r.checked = true; }

  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  function setFilter(id, dark, light) {
    const [d, l] = [hex(dark), hex(light)];
    const f = document.getElementById(id);
    ['R', 'G', 'B'].forEach((c, i) => f.querySelector('feFunc' + c + '[type=table]').setAttribute('tableValues', `${d[i]} ${l[i]}`));
  }

  const lum = rgb => { const c = rgb.map(v => v / 255).map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4); return .2126*c[0] + .7152*c[1] + .0722*c[2]; };
  const parse = s => { s = s.trim(); if (s.startsWith('#')) return [1,3,5].map(i => parseInt(s.slice(i, i+2), 16)); const m = s.match(/[\d.]+/g); return m ? m.slice(0,3).map(Number) : [0,0,0]; };
  const ratio = (a, b) => { const [x, y] = [lum(parse(a)), lum(parse(b))].sort((p, q) => q - p); return (x + .05) / (y + .05); };
  function renderContrast(v) {
    const cs = getComputedStyle(v), t = n => cs.getPropertyValue(n).trim();
    const bg = t('--bg');
    const pairs = [
      ['text / bg', t('--fg'), bg, 4.5], ['muted / bg', t('--mid'), bg, 4.5], ['muted / card', t('--mid'), t('--card'), 4.5],
      ['accent text / bg', getComputedStyle(v.querySelector('.mono.accent')).color, bg, 4.5],
      ['ink / yellow', t('--on-yellow'), t('--yellow'), 4.5], ['yellow / footer ink', t('--yellow'), '#161412', 4.5],
      ['yellow / bg', t('--yellow'), bg, 3], ['duo shadow / yellow', t('--shadow'), t('--yellow'), 0],
    ];
    contrast.innerHTML = `<strong>${st.v} · ${document.body.classList.contains('dark') ? 'dark' : 'light'}</strong><table>${pairs.map(([n, a, b, need]) => {
      const r = ratio(a, b); const cls = need === 0 ? '' : r >= 4.5 ? 'ok' : r >= 3 ? 'lg' : 'no';
      const verdict = need === 0 ? 'image range' : r >= 4.5 ? 'AA text' : r >= 3 ? 'large/UI only' : 'fails';
      return `<tr><td><span class="sw" style="background:${a}"></span><span class="sw" style="background:${b}"></span></td><td>${n}</td><td class="${cls}">${r.toFixed(2)}:1</td><td class="${cls}">${verdict}</td></tr>`;
    }).join('')}</table>`;
  }

  function render() {
    variants.forEach(v => { v.hidden = v.dataset.key !== st.v; v.style.setProperty('--yellow', st.yellow); v.style.setProperty('--shadow', st.shadow); });
    const v = variants.find(v => v.dataset.key === st.v);
    const dark = st.theme === 'dark' || (st.theme === 'auto' && mq.matches);
    document.body.classList.toggle('dark', dark);
    document.body.dataset.hover = st.hover;
    document.documentElement.dataset.motion = v.dataset.motion;
    document.documentElement.classList.toggle('rm', st.rm === 'on');
    document.querySelectorAll('feFuncR[type=gamma],feFuncG[type=gamma],feFuncB[type=gamma]').forEach(f => f.setAttribute('exponent', st.lift));
    setFilter('duo-light', st.shadow, st.yellow);
    setFilter('duo-dark', st.darkduo === 'dim' ? '#1f1d1a' : st.shadow, st.yellow);
    out.textContent = `${st.v} (${v.dataset.name})`;
    themeBtn.textContent = `theme: ${st.theme}`;
    tuneBtn.setAttribute('aria-pressed', st.tune); tune.hidden = !st.tune;
    cBtn.setAttribute('aria-pressed', st.contrast); contrast.hidden = !st.contrast;
    if (st.contrast) renderContrast(v);
    for (const [k, val] of Object.entries(st)) params.set(k === 'v' ? 'variant' : k, typeof val === 'boolean' ? (val ? '1' : '0') : val);
    history.replaceState(null, '', `?${params}${location.hash}`);
  }
  const step = n => { st.v = keys[(keys.indexOf(st.v) + n + keys.length) % keys.length]; render(); };
  const cycleTheme = () => { st.theme = themes[(themes.indexOf(st.theme) + 1) % themes.length]; render(); };

  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => step(+b.dataset.step)));
  themeBtn.addEventListener('click', cycleTheme);
  tuneBtn.addEventListener('click', () => { st.tune = !st.tune; render(); });
  cBtn.addEventListener('click', () => { st.contrast = !st.contrast; render(); });
  tune.addEventListener('change', e => { st[e.target.name] = e.target.value; render(); });
  mq.addEventListener('change', render);
  addEventListener('keydown', e => {
    if (e.target.closest('input, textarea, [contenteditable]') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 't' || e.key === 'T') cycleTheme();
    else if (e.key === 'c' || e.key === 'C') { st.contrast = !st.contrast; render(); }
  });
  render();
})();
</script>
